<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>SD Redação</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",Inter,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.cx{position:absolute;inset:10px;border-radius:26px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0b1d48 0%,#040a1a 55%,#01030a 100%);border:1px solid rgba(120,160,255,.18);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);animation:entra .6s cubic-bezier(.2,.9,.2,1) both}
@keyframes entra{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.grade{position:absolute;inset:-50%;background-image:linear-gradient(rgba(80,130,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(80,130,255,.07) 1px,transparent 1px);background-size:34px 34px;transform:perspective(500px) rotateX(62deg) translateY(28%);animation:anda 3s linear infinite;mask-image:linear-gradient(transparent 35%,#000 70%)}
@keyframes anda{to{background-position:0 34px}}
.palco{position:absolute;left:50%;top:44%;width:150px;height:150px;transform:translate(-50%,-50%)}
.anel{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#2f6bff 70%,#e5243b 88%,transparent 100%);animation:gira 1.6s linear infinite;filter:drop-shadow(0 0 14px #2f6bff)}
.anel::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#030817}
.anel2{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(110,150,255,.25);animation:pulsa 2s ease-in-out infinite}
@keyframes gira{to{transform:rotate(360deg)}}@keyframes pulsa{50%{transform:scale(1.06);opacity:.35}}
.logo{position:absolute;inset:16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#13306f,#050d22 70%);box-shadow:inset 0 0 30px rgba(47,107,255,.35)}
.logo img{width:78%;height:78%;object-fit:contain;animation:surge .9s .25s cubic-bezier(.2,1.4,.3,1) both;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
@keyframes surge{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
.brilho{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);animation:brilha 2.4s 1s ease-in-out infinite}
@keyframes brilha{to{left:130%}}
.txt{position:absolute;left:0;right:0;top:69%;text-align:center}
.txt h1{font-size:27px;font-weight:900;letter-spacing:.16em;color:#fff;animation:sobe .7s .55s both}
.txt h1 b{color:#ff3b54;text-shadow:0 0 18px rgba(229,36,59,.7)}
.txt p{margin-top:5px;font-size:11.5px;letter-spacing:.32em;color:#8fa6d8;animation:sobe .7s .75s both}
@keyframes sobe{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.barra{position:absolute;left:22%;right:22%;bottom:30px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.barra i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#2f6bff,#7aa2ff,#e5243b);box-shadow:0 0 12px #2f6bff;animation:carrega 2.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes carrega{to{width:100%}}
.ass{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:9.5px;letter-spacing:.2em;color:rgba(160,180,230,.45)}
</style></head><body><div class="cx"><div class="grade"></div><div class="brilho"></div>
<div class="palco"><div class="anel2"></div><div class="anel"></div><div class="logo"><img src="icone.png" alt=""></div></div>
<div class="txt"><h1>SD <b>REDAÇÃO</b></h1><p>SD NOTÍCIAS · SÃO DESIDÉRIO</p></div>
<div class="barra"><i></i></div><div class="ass">ALMEJO DIGITAL</div></div></body></html>
